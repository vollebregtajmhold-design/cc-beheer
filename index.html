<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CC Beheer</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root,[data-theme="light"]{--bg:#f5f6f8;--card:#fff;--border:#dde1e6;--input-bg:#f0f1f3;--text:#1a1d24;--muted:#6b7280;--accent:#4f8cff;--green:#4caf50;--red:#e57373;}
[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--border:#2a2e37;--input-bg:#11141a;--text:#e8eaed;--muted:#9aa0a6;--accent:#4f8cff;--green:#4caf50;--red:#e57373;}
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:70px;}
header{padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
h1{margin:0;font-size:18px;}
.tabs{display:flex;gap:6px;padding:10px 16px;max-width:700px;margin:0 auto;position:sticky;top:52px;background:var(--bg);z-index:9;}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;border:none;opacity:0.55;}
.tab.active{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.content{padding:16px;max-width:700px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;}
input,select,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;}
button{padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;margin-top:4px;}
button.secondary{background:#2a2e37;}
button.danger{background:var(--red);}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
th,td{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;}
.tabel-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
#o-tabel{table-layout:fixed;}
#o-tabel th,#o-tabel td{text-align:center;overflow:hidden;text-overflow:ellipsis;}
#o-tabel th:nth-child(1),#o-tabel td:nth-child(1),#o-tabel th:nth-child(7),#o-tabel td:nth-child(7){text-align:left;white-space:normal;}
#o-tabel.modus-klant{table-layout:auto;min-width:560px;}
#o-tabel.modus-klant th,#o-tabel.modus-klant td{white-space:nowrap;overflow:visible;text-overflow:initial;padding:6px 8px;}
#o-tabel.modus-klant th:nth-child(7),#o-tabel.modus-klant td:nth-child(7){white-space:normal;min-width:140px;}
#o-tabel.modus-totaal th:nth-child(1),#o-tabel.modus-totaal td:nth-child(1){width:46%;text-align:left;}
#o-tabel.modus-totaal th:nth-child(2),#o-tabel.modus-totaal td:nth-child(2),#o-tabel.modus-totaal th:nth-child(3),#o-tabel.modus-totaal td:nth-child(3),#o-tabel.modus-totaal th:nth-child(4),#o-tabel.modus-totaal td:nth-child(4){width:18%;}
th{color:var(--muted);font-weight:500;}
.totals{display:flex;justify-content:space-between;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.hidden{display:none;}
.small{font-size:12px;color:var(--muted);}
.item-actions{display:flex;gap:6px;margin-top:6px;}
.badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#e0e3e8;font-size:11px;color:#000;}
.fh-btn{display:flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:8px;background:#e8174a;color:#fff;font-size:14px;font-weight:600;text-decoration:none;margin-top:4px;}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1>&#128230; CC Beheer 2026 <span style="font-size:11px;color:var(--muted);font-weight:400;">v3.0</span></h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="sync-indicator" class="small"></span>
      <button class="secondary" style="margin:0;padding:6px 10px;" onclick="toggleThema()">&#127769;/&#9728;</button>
    </div>
  </div>
</header>
<div class="tabs">
  <div class="tab active" data-tab="invoer">Invoer</div>
  <div class="tab" data-tab="overzicht">Overzicht</div>
  <div class="tab" data-tab="klanten">Instellingen</div>
</div>
<div class="content">
  <div id="tab-invoer" class="card">
    <label>Klant</label><select id="i-klant" onchange="vulTransporteur()"></select>
    <label>Datum</label><input type="date" id="i-datum">
    <label>Bonnummer</label><input type="text" id="i-bon" placeholder="optioneel">
    <div class="row">
      <div><label>CC</label><input type="number" id="i-cc" placeholder="0"></div>
      <div><label>Platen</label><input type="number" id="i-platen" placeholder="0"></div>
      <div><label>Opzet</label><input type="number" id="i-opzet" placeholder="0"></div>
    </div>
    <label>Transporteur</label><input type="text" id="i-transporteur" placeholder="bv. Hogenboom">
    <label>Opmerking</label><textarea id="i-opmerking" rows="2"></textarea>
    <div class="row" style="margin-top:4px;">
      <button onclick="opslaanInvoer()">&#10003; Opslaan</button>
      <a href="https://diensten.royalfloraholland.com/LogistiekeMiddelen/transactions/transactions.aspx" target="_blank" class="fh-btn">&#127799; Flora Holland</a>
    </div>
    <div id="i-status" class="small"></div>
    <hr style="border-color:var(--border);margin:14px 0;">
    <div class="small">Alle invoer (nieuwste eerst)</div>
    <div style="max-height:300px;overflow-y:auto;"><table id="i-laatste"><tbody></tbody></table></div>
    <div style="margin-top:12px;padding:10px 12px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-size:12px;color:#856404;">&#128190; Maak dagelijks een backup om dataverlies te voorkomen</span>
      <button onclick="exportBackup()" style="margin:0;padding:7px 12px;font-size:13px;background:#ffc107;color:#000;white-space:nowrap;">&#11015; Backup</button>
    </div>
  </div>
  <div id="tab-overzicht" class="card hidden">
    <label>Klant</label><select id="o-klant" onchange="toonOverzicht()"></select>
    <div id="o-klantinfo" class="small" style="margin-top:8px;"></div>
    <div class="tabel-scroll">
      <table id="o-tabel">
        <thead><tr><th>Datum</th><th>Wk</th><th>Bon</th><th>CC</th><th>Platen</th><th>Opzet</th><th>Opm.</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="totals"><span id="o-totcc">CC: 0</span><span id="o-totplaten">Platen: 0</span><span id="o-totopzet">Opzet: 0</span></div>
    <div class="item-actions">
      <button onclick="exportPdf()">&#128196; PDF</button>
      <button class="secondary" onclick="mailOverzicht()">&#9993; Mail</button>
    </div>
    <div id="o-status" class="small"></div>
    <hr style="border-color:var(--border);margin:14px 0;">
    <button class="secondary" onclick="exportTotaalPdf()">&#128202; Totaaloverzicht alle klanten</button>
    <button class="secondary" onclick="exportCsv()">&#128229; Download Excel (CSV)</button>
    <hr style="border-color:var(--border);margin:14px 0;">
    <div class="small" style="font-weight:600;margin-bottom:4px;">Verzendlijst</div>
    <div id="o-verzendlijst"></div>
  </div>
  <div id="tab-klanten" class="card hidden">
    <label>Naam</label><input type="text" id="k-naam" placeholder="Klantnaam">
    <label>Adres</label><input type="text" id="k-adres">
    <label>Woonplaats</label><input type="text" id="k-woonplaats">
    <label>Telefoon</label><input type="text" id="k-telefoon">
    <label>E-mail</label><input type="email" id="k-email">
    <label>Vaste transporteur</label><input type="text" id="k-transporteur">
    <button onclick="opslaanKlant()">&#10133; Klant toevoegen</button>
    <div id="k-status" class="small"></div>
    <hr style="border-color:var(--border);margin:14px 0;">
    <div class="small" style="font-weight:600;margin-bottom:6px;">&#9993; E-mail instellingen</div>
    <label>Webapp-URL (Apps Script)</label>
    <input type="text" id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="secondary" onclick="opslaanEmailConfig()">&#128190; Opslaan</button>
    <div id="cfg-status" class="small"></div>
    <hr style="border-color:var(--border);margin:14px 0;">
    <div id="k-lijst"></div>
    <hr style="border-color:var(--border);margin:14px 0;">
    <div class="small" style="font-weight:600;margin-bottom:6px;">&#128190; Backup</div>
    <div class="row">
      <button class="secondary" onclick="exportBackup()">&#11015; Backup downloaden</button>
      <button class="secondary" onclick="document.getElementById('k-import').click()">&#11014; Backup laden</button>
    </div>
    <input type="file" id="k-import" accept=".json" style="display:none;" onchange="importBackup(event)">
  </div>
</div>

// Thema
let thema=localStorage.getItem('cc_thema')||'light';
document.documentElement.setAttribute('data-theme',thema);
function toggleThema(){thema=thema==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',thema);localStorage.setItem('cc_thema',thema);}
// Data variabelen - gevuld door Firebase
var klanten=[];
var invoer=[];
// Helpers
function laad(k){try{return JSON.parse(localStorage.getItem(k))||[];}catch(e){return[];}}
function bewaar(k,d){localStorage.setItem(k,JSON.stringify(d));}
window.bewaar=bewaar;
function fmtDatum(iso){return new Date(iso).toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function getISOWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));const y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/86400000)+1)/7);}
function kleurCel(v){if(v>0)return'background:#c8e6c9;';if(v<0)return'background:#ffcdd2;';return'';}
function volgendInvoerId(){let m=0;invoer.forEach(r=>{if(r.id>m)m=r.id;});return m+1;}
function toonSyncIndicator(t){const el=document.getElementById('sync-indicator');if(el)el.textContent=t;if(t==='☁️'){setTimeout(()=>{if(el&&el.textContent===t)el.textContent='';},2000);}}
// Tabs
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.content>.card').forEach(x=>x.classList.add('hidden'));
  t.classList.add('active');
  document.getElementById('tab-'+t.dataset.tab).classList.remove('hidden');
  if(t.dataset.tab==='overzicht'){toonOverzicht();toonVerzendlijst();}
  if(t.dataset.tab==='klanten'){toonKlanten();vulEmailConfigVelden();}
  if(t.dataset.tab==='invoer')toonLaatsteInvoer();
};});
// Init datum
document.getElementById('i-datum').value=new Date().toISOString().slice(0,10);
// Klant selects
function vulKlantSelects(){
  const s=[...klanten].sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  const o=s.map(k=>'<option value="'+k.naam+'">'+k.naam+'</option>').join('');
  document.getElementById('i-klant').innerHTML='<option value="">-- kies klant --</option>'+o;
  document.getElementById('o-klant').innerHTML='<option value="">-- kies klant --</option><option value="__totaal__">📊 Totaaloverzicht</option>'+o;
}
function vulTransporteur(){const k=klanten.find(x=>x.naam===document.getElementById('i-klant').value);document.getElementById('i-transporteur').value=k&&k.transporteur?k.transporteur:'';}
// Invoer
let bewerkInvoerId=null;
function opslaanInvoer(){
  const klant=document.getElementById('i-klant').value;
  const datum=document.getElementById('i-datum').value;
  if(!klant){document.getElementById('i-status').textContent='Kies een klant.';return;}
  if(!datum){document.getElementById('i-status').textContent='Kies een datum.';return;}
  const v={klant,datum,week:'wk '+getISOWeek(new Date(datum)),bon:document.getElementById('i-bon').value.trim(),transporteur:document.getElementById('i-transporteur').value.trim(),cc:Number(document.getElementById('i-cc').value)||0,platen:Number(document.getElementById('i-platen').value)||0,opzet:Number(document.getElementById('i-opzet').value)||0,opmerking:document.getElementById('i-opmerking').value.trim()};
  let item;
  if(bewerkInvoerId){const idx=invoer.findIndex(r=>r.id===bewerkInvoerId);if(idx>-1)invoer[idx]=Object.assign({id:bewerkInvoerId},v);item=invoer[idx];bewerkInvoerId=null;document.querySelector('#tab-invoer button').textContent='✓ Opslaan';document.getElementById('i-status').textContent='Wijziging opgeslagen voor '+klant;}

// Klanten
let bewerkKlantNaam=null;
function opslaanKlant(){
  const naam=document.getElementById('k-naam').value.trim();if(!naam){document.getElementById('k-status').textContent='Naam verplicht.';return;}
  const data={naam,adres:document.getElementById('k-adres').value.trim(),woonplaats:document.getElementById('k-woonplaats').value.trim(),telefoon:document.getElementById('k-telefoon').value.trim(),email:document.getElementById('k-email').value.trim(),transporteur:document.getElementById('k-transporteur').value.trim()};
  if(bewerkKlantNaam){const idx=klanten.findIndex(k=>k.naam===bewerkKlantNaam);if(idx>-1)klanten[idx]=data;if(bewerkKlantNaam!==naam){invoer.forEach(r=>{if(r.klant===bewerkKlantNaam){r.klant=naam;if(window.fbSaveInvoer)window.fbSaveInvoer(r);}});if(window.fbDeleteKlant)window.fbDeleteKlant(bewerkKlantNaam);}document.getElementById('k-status').textContent='Gewijzigd.';bewerkKlantNaam=null;document.querySelector('#tab-klanten button').textContent='➕ Klant toevoegen';}
  else{klanten.push(data);document.getElementById('k-status').textContent='Toegevoegd.';}
  if(window.fbSaveKlant)window.fbSaveKlant(data);
  ['k-naam','k-adres','k-woonplaats','k-telefoon','k-email','k-transporteur'].forEach(id=>document.getElementById(id).value='');
  vulKlantSelects();toonKlanten();
}
function bewerkKlant(naam){const k=klanten.find(x=>x.naam===naam);if(!k)return;bewerkKlantNaam=naam;document.getElementById('k-naam').value=k.naam;document.getElementById('k-adres').value=k.adres||'';document.getElementById('k-woonplaats').value=k.woonplaats||'';document.getElementById('k-telefoon').value=k.telefoon||'';document.getElementById('k-email').value=k.email||'';document.getElementById('k-transporteur').value=k.transporteur||'';document.querySelector('#tab-klanten button').textContent='💾 Wijziging opslaan';document.getElementById('k-naam').scrollIntoView({behavior:'smooth'});}
function verwijderKlant(naam){if(!confirm('Klant "'+naam+'" verwijderen?'))return;klanten=klanten.filter(k=>k.naam!==naam);if(window.fbDeleteKlant)window.fbDeleteKlant(naam);vulKlantSelects();toonKlanten();}
function toonKlanten(){
  const s=[...klanten].sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  document.getElementById('k-lijst').innerHTML=s.map(k=>'<div class="card" style="padding:8px 10px;display:flex;align-items:center;gap:8px;"><div style="flex:1;min-width:0;overflow:hidden;"><b>'+k.naam+'</b> <span class="badge">'+(k.woonplaats||'')+'</span><div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(k.email||'')+' '+(k.telefoon||'')+'</div></div><div style="display:flex;gap:4px;flex-shrink:0;"><button class="secondary" style="padding:6px 8px;" onclick="bewerkKlant(''+k.naam+'')">✏️</button><button class="danger" style="padding:6px 8px;" onclick="verwijderKlant(''+k.naam+'')">🗑️</button></div></div>').join('')||'<div class="small">Nog geen klanten.</div>';
}
// Backup
function exportBackup(){const d={klanten,invoer,verzonden:laad('cc_verzonden'),email_instellingen:laad('cc_email_cfg')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='CC_Beheer_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importBackup(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=async function(e){try{const d=JSON.parse(e.target.result);if(!confirm('Gegevens overschrijven met backup?'))return;if(d.klanten){klanten=d.klanten;}if(d.invoer){invoer=d.invoer;}if(d.verzonden)bewaar('cc_verzonden',d.verzonden);if(d.email_instellingen)bewaar('cc_email_cfg',d.email_instellingen);vulKlantSelects();toonLaatsteInvoer();toonOverzicht();toonVerzendlijst();if(d.klanten)for(const k of d.klanten){if(window.fbSaveKlant)await window.fbSaveKlant(k);}if(d.invoer)for(const x of d.invoer){if(window.fbSaveInvoer)await window.fbSaveInvoer(x);}alert('Backup geladen en naar cloud gestuurd.');}catch(err){alert('Ongeldig bestand: '+err);}};r.readAsText(file);}
// Init
vulKlantSelects();
toonLaatsteInvoer();
// Auto backup
setTimeout(()=>{const v=new Date().toISOString().slice(0,10);if(localStorage.getItem('cc_backup')!==v&&invoer.length>0){exportBackup();localStorage.setItem('cc_backup',v);}},15000);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDcIlmELWAClhg-6aOHCs-QsgxBJTkP8UQ",authDomain:"cc-beheer.firebaseapp.com",projectId:"cc-beheer",storageBucket:"cc-beheer.firebasestorage.app",messagingSenderId:"835121705327",appId:"1:835121705327:web:f4f7fabf36d868809b389a"};
const app=initializeApp(cfg);const db=getFirestore(app);
function veiligId(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'item';}
onSnapshot(collection(db,'klanten'),snap=>{window.klanten=snap.docs.map(d=>d.data());window.vulKlantSelects?.();window.toonKlanten?.();window.toonOverzicht?.();});
onSnapshot(collection(db,'invoer'),snap=>{window.invoer=snap.docs.map(d=>d.data());window.toonLaatsteInvoer?.();window.toonOverzicht?.();});
onSnapshot(collection(db,'verzonden'),snap=>{window.bewaar('cc_verzonden',snap.docs.map(d=>d.data()));window.toonVerzendlijst?.();});
onSnapshot(collection(db,'config'),snap=>{const m=snap.docs.find(d=>d.id==='main');if(m){window.bewaar('cc_email_cfg',m.data());window.vulEmailConfigVelden?.();}});
window.fbSaveKlant=(k)=>setDoc(doc(db,'klanten',veiligId(k.naam)),k);
window.fbDeleteKlant=(naam)=>deleteDoc(doc(db,'klanten',veiligId(naam)));
window.fbSaveInvoer=(r)=>setDoc(doc(db,'invoer',String(r.id)),r);
window.fbDeleteInvoer=(id)=>deleteDoc(doc(db,'invoer',String(id)));
window.fbSaveVerzonden=(v)=>setDoc(doc(db,'verzonden',String(v.id)),v);
window.fbDeleteVerzonden=(id)=>deleteDoc(doc(db,'verzonden',String(id)));
window.fbSaveEmailConfig=(c)=>setDoc(doc(db,'config','main'),c);
</script>
